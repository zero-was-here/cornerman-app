<!doctype html><meta charset="utf-8"><title>transfer</title>
<script>
const names = decodeURIComponent(location.hash.slice(1)).split(',').filter(Boolean);
(async () => {
  for (const n of names) {
    const buf = await (await fetch(n, { cache: 'no-store' })).arrayBuffer();
    parent.postMessage({ tmpAsc: true, name: n, buf }, 'https://appstoreconnect.apple.com', [buf]);
  }
  parent.postMessage({ tmpAsc: true, done: true }, 'https://appstoreconnect.apple.com');
})();
</script>
